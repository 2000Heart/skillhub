apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillhub-server
  labels:
    app.kubernetes.io/name: skillhub-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skillhub-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillhub-server
    spec:
      containers:
        - name: server
          image: ghcr.io/iflytek/skillhub-server:edge
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker

            # Database
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: spring-datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: spring-datasource-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: spring-datasource-password

            # Redis
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: redis-host
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: redis-port

            # Storage
            - name: STORAGE_BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: storage-base-path
            - name: SKILLHUB_STORAGE_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-storage-provider
            - name: SKILLHUB_STORAGE_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-storage-s3-endpoint
            - name: SKILLHUB_STORAGE_S3_PUBLIC_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-storage-s3-public-endpoint
            - name: SKILLHUB_STORAGE_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-storage-s3-bucket
            - name: SKILLHUB_STORAGE_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-storage-s3-region
            - name: SKILLHUB_STORAGE_S3_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-storage-s3-force-path-style
            - name: SKILLHUB_STORAGE_S3_DISABLE_CHUNKED_ENCODING
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-storage-s3-disable-chunked-encoding
            - name: SKILLHUB_STORAGE_S3_AUTO_CREATE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-storage-s3-auto-create-bucket
            - name: SKILLHUB_STORAGE_S3_PRESIGN_EXPIRY
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-storage-s3-presign-expiry
            - name: SKILLHUB_STORAGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: skillhub-storage-s3-access-key
                  optional: true
            - name: SKILLHUB_STORAGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: skillhub-storage-s3-secret-key
                  optional: true

            # Scanner
            - name: SKILLHUB_SECURITY_SCANNER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skill-scanner-enabled
            - name: SKILLHUB_SECURITY_SCANNER_URL
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skill-scanner-url
            - name: SKILLHUB_SECURITY_SCANNER_MODE
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skill-scanner-mode

            # Session
            - name: SESSION_COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: session-cookie-secure

            # Public entrypoint (used by redirect/callback flows).
            - name: SKILLHUB_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-public-base-url

            # DingTalk enterprise web-app auth (optional).
            - name: SKILLHUB_DINGTALK_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-dingtalk-enabled
            - name: SKILLHUB_DINGTALK_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-dingtalk-client-id
            - name: SKILLHUB_DINGTALK_DEFAULT_CORP_ID
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-dingtalk-default-corp-id
            - name: SKILLHUB_DINGTALK_SUPER_ADMIN_UNION_IDS
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-dingtalk-super-admin-union-ids
            - name: SKILLHUB_DINGTALK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: skillhub-dingtalk-client-secret
                  optional: true

            # Bootstrap Admin (non-sensitive from ConfigMap)
            - name: BOOTSTRAP_ADMIN_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: bootstrap-admin-enabled
            - name: BOOTSTRAP_ADMIN_USER_ID
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: bootstrap-admin-user-id
            - name: BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: bootstrap-admin-username
            - name: BOOTSTRAP_ADMIN_DISPLAY_NAME
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: bootstrap-admin-display-name
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: bootstrap-admin-email

            # Bootstrap Admin Password (sensitive from Secret)
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: bootstrap-admin-password
                  optional: true

            # OAuth2 GitHub (optional)
            - name: OAUTH2_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: oauth2-github-client-id
                  optional: true
            - name: OAUTH2_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: skillhub-secret
                  key: oauth2-github-client-secret
                  optional: true

          volumeMounts:
            - name: skillhub-storage
              mountPath: /var/lib/skillhub/storage
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: skillhub-storage
          persistentVolumeClaim:
            claimName: skillhub-storage-pvc
