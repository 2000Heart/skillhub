apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillhub-web
  labels:
    app.kubernetes.io/name: skillhub-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skillhub-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillhub-web
    spec:
      containers:
        - name: web
          image: ghcr.io/iflytek/skillhub-web:edge
          imagePullPolicy: IfNotPresent
          env:
            - name: SKILLHUB_API_UPSTREAM
              value: http://skillhub-server:8080
            - name: SKILLHUB_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-public-base-url
            - name: SKILLHUB_WEB_AUTH_MODE
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-web-auth-mode
            - name: SKILLHUB_WEB_DINGTALK_AUTH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-web-dingtalk-auth-enabled
            - name: SKILLHUB_WEB_DINGTALK_AUTO_LOGIN
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-web-dingtalk-auto-login
            - name: SKILLHUB_WEB_DINGTALK_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skillhub-dingtalk-client-id
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
